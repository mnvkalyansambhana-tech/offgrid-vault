<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Generator — pop</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0E7A50}a:hover{color:#0A5C3C}
.pop{position:relative}
.pop::before{content:"";position:absolute;left:0;bottom:-6px;width:100%;height:6px;background:var(--eb,#7A7A7A);transform:skewX(45deg);transform-origin:top left}
.pop::after{content:"";position:absolute;top:0;right:-6px;width:6px;height:100%;background:var(--er,#B5B5B5);transform:skewY(45deg);transform-origin:top left}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8F8F8A; color: #0D0D0D; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end">
<div role="dialog" aria-label="Generate password" style="display: flex; flex-direction: column">
<div style="background: #0D0D0D; color: #FFFFFF; padding: 24px 24px 20px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 3px; color: #A6A6A6">GENERATOR</span>
<h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 32px">new password.</h2>
<div style="display: flex; gap: 10px; align-items: stretch">
<div style="flex-grow: 1; background: #161616; border: 1px solid #2A2A2A; padding: 14px; font: 500 17px 'JetBrains Mono', monospace; word-break: break-all">[generated-password-20ch]</div>
<button aria-label="Generate another" style="width: 52px; border: 1.5px solid #4DFFB4; background: transparent; color: #4DFFB4; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg></button>
</div>
<span style="font: 500 11px 'JetBrains Mono', monospace; color: #A6A6A6; letter-spacing: 1px">20 CHARS · 94-CHAR SET · ~131 BITS</span>
</div>
<div style="background: #F1F1EE; padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; letter-spacing: 2px"><label for="len" style="color: #55554F">LENGTH</label><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">20</span></div>
<input id="len" type="range" min="8" max="64" value="20" style="accent-color: #0D0D0D">
</div>
<div style="display: flex; flex-direction: column; font-size: 14px; font-weight: 600">
<label style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-top: 1px solid #D9D9D3">A–Z<input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0D0D0D"></label>
<label style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-top: 1px solid #D9D9D3">a–z<input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0D0D0D"></label>
<label style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-top: 1px solid #D9D9D3">0–9<input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0D0D0D"></label>
<label style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-top: 1px solid #D9D9D3">symbols<input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0D0D0D"></label>
<label style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-top: 1px solid #D9D9D3; border-bottom: 1px solid #D9D9D3">avoid look-alikes<input type="checkbox" style="width: 20px; height: 20px; accent-color: #0D0D0D"></label>
</div>
<button class="pop" style="--eb: #4A4A4A; --er: #7A7A7A; margin-right: 6px; height: 56px; border: 0; background: #0D0D0D; color: #FFFFFF; font: 800 14px 'Manrope', sans-serif; letter-spacing: 3px">USE PASSWORD</button>
<span style="font-size: 12px; color: #55554F; text-align: center">fills the form directly — never the clipboard</span>
</div>
</div>
</div>
</x-dc>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autofill save — pop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0E7A50}a:hover{color:#0A5C3C}
.pop{position:relative}
.pop::before{content:"";position:absolute;left:0;bottom:-6px;width:100%;height:6px;background:var(--eb,#7A7A7A);transform:skewX(45deg);transform-origin:top left}
.pop::after{content:"";position:absolute;top:0;right:-6px;width:6px;height:100%;background:var(--er,#B5B5B5);transform:skewY(45deg);transform-origin:top left}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8F939B; color: #0D0D0D; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end">
<div style="flex-grow: 1; padding: 48px 24px; display: flex; flex-direction: column; gap: 8px; color: #F2F3F5">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 3px">ANOTHER APP · DIMMED</span>
<span style="font-size: 20px; font-weight: 700">Welcome back</span>
</div>
<div role="dialog" aria-label="Save to OffGrid Vault" style="display: flex; flex-direction: column">
<div style="background: #0D0D0D; color: #FFFFFF; padding: 22px 24px 18px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 3px; color: #4DFFB4">OFFGRID VAULT · AUTOFILL</span>
<h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.05">save this login?</h2>
</div>
<div style="background: #F1F1EE; padding: 18px 24px 34px; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #D9D9D3; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 15px; font-weight: 700">[Example App]</span>
<span style="font-size: 13px; color: #55554F">[user@example.com] · <span style="font-family: 'JetBrains Mono', monospace">••••••••••</span></span>
</div>
<p style="margin: 0; font-size: 13px; color: #55554F; line-height: 1.45">already saved? the old password moves to history.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<button style="height: 54px; border: 1.5px solid #0D0D0D; background: transparent; color: #0D0D0D; font: 800 12px 'Manrope', sans-serif; letter-spacing: 2px">NOT NOW</button>
<button class="pop" style="--eb: #4A4A4A; --er: #7A7A7A; margin-right: 6px; height: 54px; border: 0; background: #0D0D0D; color: #FFFFFF; font: 800 12px 'Manrope', sans-serif; letter-spacing: 2px">SAVE</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>

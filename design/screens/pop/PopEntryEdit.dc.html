<!doctype html>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0E7A50}a:hover{color:#0A5C3C}
.pop{position:relative}
.pop::before{content:"";position:absolute;left:0;bottom:-6px;width:100%;height:6px;background:var(--eb,#7A7A7A);transform:skewX(45deg);transform-origin:top left}
.pop::after{content:"";position:absolute;top:0;right:-6px;width:6px;height:100%;background:var(--er,#B5B5B5);transform:skewY(45deg);transform-origin:top left}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F1F1EE; color: #0D0D0D; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="background: #0D0D0D; color: #FFFFFF; padding: 8px 24px 22px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; margin-left: -12px">
<button aria-label="Discard" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<span style="flex-grow: 1"></span>
<button class="pop" style="--eb: #6E6E6E; --er: #A8A8A8; margin-right: 6px; height: 40px; padding: 0 18px; border: 0; background: #FFFFFF; color: #0D0D0D; font: 800 12px 'Manrope', sans-serif; letter-spacing: 2px">SAVE</button>
</div>
<span style="font-size: 11px; font-weight: 800; letter-spacing: 3px; color: #A6A6A6">EDIT LOGIN</span>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 36px; line-height: 1.05">github.</h1>
</div>
<div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="t" style="font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #55554F">TITLE</label><input id="t" type="text" value="GitHub" style="height: 46px; border: 1.5px solid #BDBDB4; border-radius: 0; padding: 0 14px; font: 500 15px 'Manrope', sans-serif; background: #FFFFFF"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="u" style="font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #55554F">USERNAME</label><input id="u" type="text" value="[dev@example.com]" style="height: 46px; border: 1.5px solid #BDBDB4; border-radius: 0; padding: 0 14px; font: 500 15px 'Manrope', sans-serif; background: #FFFFFF"></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="p" style="font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #55554F">PASSWORD</label>
<div style="display: flex; gap: 8px">
<input id="p" type="password" value="passwordvalue" style="min-width: 0; flex-grow: 1; height: 46px; border: 1.5px solid #0D0D0D; border-radius: 0; padding: 0 14px; font: 400 15px 'JetBrains Mono', monospace; background: #FFFFFF">
<button style="height: 46px; padding: 0 12px; border: 1.5px solid #0D0D0D; background: #0D0D0D; color: #4DFFB4; font: 800 11px 'Manrope', sans-serif; letter-spacing: 1.5px; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg>GENERATE</button>
</div>
<span style="font-size: 12px; color: #55554F">changing it moves the old one to history</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="w" style="font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #55554F">WEBSITES</label><input id="w" type="text" value="github.com" style="height: 46px; border: 1.5px solid #BDBDB4; border-radius: 0; padding: 0 14px; font: 500 15px 'Manrope', sans-serif; background: #FFFFFF"><a href="#" style="font-size: 10px; font-weight: 800; letter-spacing: 2px; text-decoration: none; padding: 8px 0">+ ADD WEBSITE</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #55554F">LINKED APPS</span><div style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border: 1px solid #D9D9D3; padding: 0 0 0 14px; font-size: 15px; font-weight: 600"><span>[GitHub app]</span><button aria-label="Unlink app" style="width: 44px; height: 44px; border: 0; background: transparent; color: #55554F; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="n" style="font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #55554F">NOTES</label><textarea id="n" rows="2" style="border: 1.5px solid #BDBDB4; border-radius: 0; padding: 12px 14px; font: 400 15px 'Manrope', sans-serif; background: #FFFFFF; resize: none"></textarea></div>
</div>
</div>
</x-dc>

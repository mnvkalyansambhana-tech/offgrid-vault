<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm words — pop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0E7A50}a:hover{color:#0A5C3C}
.pop{position:relative}
.pop::before{content:"";position:absolute;left:0;bottom:-6px;width:100%;height:6px;background:var(--eb,#7A7A7A);transform:skewX(45deg);transform-origin:top left}
.pop::after{content:"";position:absolute;top:0;right:-6px;width:6px;height:100%;background:var(--er,#B5B5B5);transform:skewY(45deg);transform-origin:top left}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F1F1EE; color: #0D0D0D; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="background: #0D0D0D; color: #FFFFFF; padding: 8px 24px 28px; display: flex; flex-direction: column; gap: 14px">
<button aria-label="Back to words" style="margin-left: -12px; width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M15 18l-6-6 6-6"></path></svg></button>
<span style="font-size: 11px; font-weight: 800; letter-spacing: 3px; color: #A6A6A6">STEP 3 OF 4</span>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.05">prove it.</h1>
<p style="margin: 0; font-size: 15px; color: #C9C9C9">enter words #3, #7 and #11 from your paper</p>
</div>
<div style="flex-grow: 1; padding: 24px 24px 40px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px"><label for="w3" style="font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #55554F">WORD #3</label><input id="w3" type="text" autocomplete="off" style="height: 52px; border: 1.5px solid #0D0D0D; padding: 0 14px; font: 400 16px 'JetBrains Mono', monospace; background: #FFFFFF; border-radius: 0"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="w7" style="font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #55554F">WORD #7</label><input id="w7" type="text" autocomplete="off" style="height: 52px; border: 1.5px solid #BDBDB4; padding: 0 14px; font: 400 16px 'JetBrains Mono', monospace; background: #FFFFFF; border-radius: 0"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="w11" style="font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #55554F">WORD #11</label><input id="w11" type="text" autocomplete="off" style="height: 52px; border: 1.5px solid #BDBDB4; padding: 0 14px; font: 400 16px 'JetBrains Mono', monospace; background: #FFFFFF; border-radius: 0"></div>
<p style="margin: 0; font-size: 13px; color: #55554F">positions are picked at random each time.</p>
<button class="pop" style="--eb: #4A4A4A; --er: #7A7A7A; margin: auto 6px 0 0; height: 56px; border: 0; background: #0D0D0D; color: #FFFFFF; font: 800 14px 'Manrope', sans-serif; letter-spacing: 3px">CONFIRM</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>

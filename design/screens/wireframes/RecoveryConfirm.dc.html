<div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid #D6D6CF">

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="w3" style="font-size: 13px; font-weight: 500; color: #4A4A45">Word #3</label>

</div>

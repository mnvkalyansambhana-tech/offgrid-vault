<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Password generator</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F5F4A}a:hover{color:#163F32}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8C8C86; color: #1C1C1C; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end">
<div role="dialog" aria-label="Generate password" style="background: #F6F6F2; border-radius: 24px 24px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 18px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #BDBDB4"></span>
<h2 style="margin: 0; font-size: 20px; font-weight: 600">Generate password</h2>
<div style="background: #FFFFFF; border: 1px solid #D6D6CF; border-radius: 12px; padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 8px">
<span style="flex-grow: 1; font: 500 17px 'IBM Plex Mono', monospace; word-break: break-all">[generated-password-20ch]</span>
<button aria-label="Generate another" style="width: 44px; height: 44px; border: 0; background: #E3ECE8; border-radius: 10px; color: #1F5F4A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 15px"><label for="len">Length</label><span style="font-weight: 600">20</span></div>
<input id="len" type="range" min="8" max="64" value="20" style="accent-color: #1F5F4A">
</div>
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 15px">
<label style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">Uppercase A–Z<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1F5F4A"></label>
<label style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">Lowercase a–z<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1F5F4A"></label>
<label style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">Digits 0–9<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1F5F4A"></label>
<label style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">Symbols !@#…<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1F5F4A"></label>
<label style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">Avoid look-alikes (0 O 1 l I)<input type="checkbox" style="width: 22px; height: 22px; accent-color: #1F5F4A"></label>
</div>
<button style="min-height: 52px; border-radius: 12px; border: 0; background: #1F5F4A; color: #FFFFFF; font: 600 16px 'IBM Plex Sans', sans-serif">Use this password</button>
<p style="margin: 0; font-size: 12px; color: #5E5E58; text-align: center">Fills the form directly — never copied to the clipboard</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
